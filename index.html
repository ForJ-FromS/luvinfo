<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성향글</title>
<style>
  :root {
    --bg: #08080B;
    --gold: #C9A227;
    --card: color-mix(in srgb, var(--bg), #9a9ab8 5%);
    --card2: color-mix(in srgb, var(--bg), #9a9ab8 9%);
    --line: color-mix(in srgb, var(--bg), #b0b0cc 14%);
    --gold-dim: color-mix(in srgb, var(--gold), black 35%);
    --tx: #E8E4DA;
    --tx-dim: #8B8878;
    --tx-mute: #55524A;
    --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--tx); font-family: var(--font); transition: background .3s; min-height: 100vh; }
  button { font-family: var(--font); }
  a { color: inherit; }

  #site { transition: max-width .3s; }
  body.mv #site {
    max-width: 396px; margin: 56px auto 30px;
    border: 1px solid var(--line); border-radius: 26px;
    overflow: hidden; box-shadow: 0 20px 70px #000a;
  }

  /* ══ 랜딩 ══ */
  #landing { display: none; min-height: 100vh; align-items: center; justify-content: center; flex-direction: column; gap: 26px; padding: 30px 20px; text-align: center; }
  #landing.show { display: flex; }
  #landing h1 { font-size: 34px; letter-spacing: .4em; text-indent: .4em; font-weight: 600; }
  #landing .sub { font-size: 11px; letter-spacing: .28em; color: var(--gold); }
  #landing .desc { font-size: 13px; color: var(--tx-dim); line-height: 2; max-width: 400px; }
  .btn {
    padding: 12px 28px; border-radius: 999px;
    border: 1px solid var(--gold-dim);
    background: transparent; color: var(--gold);
    font-size: 13px; letter-spacing: .1em; cursor: pointer;
    transition: all .2s;
  }
  .btn:hover { border-color: var(--gold); }
  .btn.solid { background: var(--gold); color: #000; font-weight: 700; }
  #landing .foot-note { font-size: 10px; letter-spacing: .2em; color: var(--tx-mute); }

  /* ══ 게이트 ══ */
  #gate { display: none; min-height: 100vh; align-items: center; justify-content: center; flex-direction: column; gap: 20px; padding: 30px 20px; }
  #gate.show { display: flex; }
  #gate img { max-width: min(420px, 86vw); max-height: 46vh; border-radius: 14px; border: 1px solid var(--line); object-fit: cover; }
  #gate .g-msg { font-size: 13px; color: var(--tx-dim); letter-spacing: .06em; text-align: center; line-height: 1.9; white-space: pre-line; }
  #gate input {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    color: var(--tx); font-size: 13px; padding: 11px 20px; text-align: center;
    letter-spacing: .2em; width: 220px; font-family: var(--font);
  }
  #gate input:focus { outline: none; border-color: var(--gold-dim); }

  /* ══ 헤더 ══ */
  .hero {
    position: relative; height: 280px;
    background: linear-gradient(180deg, #0B0E1E 0%, #10142B 55%, var(--bg) 100%);
    background-size: cover; background-position: center;
  }
  body.mv .hero { height: 210px; }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, var(--bg) 100%);
    pointer-events: none;
  }
  .hero-mark { position: absolute; top: 22px; left: 26px; font-size: 10px; letter-spacing: .32em; color: var(--gold); z-index: 2; }
  .hero-title { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; z-index: 2; }
  body.mv .hero-title { bottom: 42px; }
  .hero-title h1 { font-size: 36px; font-weight: 600; letter-spacing: .42em; text-indent: .42em; }
  body.mv .hero-title h1 { font-size: 27px; }
  .hero-title p { margin-top: 10px; font-size: 10.5px; letter-spacing: .3em; color: var(--gold); }
  body[data-header="text"] .hero { background: var(--bg) !important; height: auto; padding: 66px 0 8px; }
  body[data-header="text"] .hero::after, body[data-header="text"] .hero-mark { display: none; }
  body[data-header="text"] .hero-title { position: static; }
  body[data-header="img"] .hero-title { display: none; }

  /* ══ 네비 5종 ══ */
  .nav {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, var(--bg) 82%, transparent);
    padding: 18px 0 20px;
    display: flex; justify-content: center; align-items: baseline;
    flex-wrap: wrap;
  }
  .nav a {
    font-size: 12px; letter-spacing: .24em; text-indent: .24em;
    color: var(--tx-mute); cursor: pointer;
    padding: 4px 24px; position: relative; user-select: none;
    transition: color .25s; text-decoration: none;
  }
  body.mv .nav a { padding: 4px 14px; }
  .nav a .num, .nav a .br { display: none; }
  .nav a:hover { color: var(--tx-dim); }
  .nav a.on { color: var(--gold); }
  body[data-nav="dot"] .nav a + a::before { content: '·'; position: absolute; left: -3px; color: var(--tx-mute); opacity: .5; }
  body[data-nav="dot"] .nav a.on::after {
    content: ''; position: absolute; left: 50%; bottom: -7px;
    transform: translateX(-50%);
    width: 3px; height: 3px; border-radius: 50%; background: var(--gold);
  }
  body[data-nav="underline"] .nav a.on::after {
    content: ''; position: absolute; left: 24px; right: 24px; bottom: -6px;
    height: 1px; background: var(--gold);
  }
  body.mv[data-nav="underline"] .nav a.on::after { left: 14px; right: 14px; }
  body[data-nav="number"] .nav a .num {
    display: inline; font-size: 9px; letter-spacing: .1em;
    color: var(--gold-dim); margin-right: 7px; vertical-align: 2px;
  }
  body[data-nav="number"] .nav a.on .num { color: var(--gold); }
  body[data-nav="bracket"] .nav a { font-family: monospace; letter-spacing: .12em; text-indent: 0; }
  body[data-nav="bracket"] .nav a.on .br { display: inline; color: var(--gold-dim); margin: 0 5px; }
  body[data-nav="pill"] .nav { gap: 8px; }
  body[data-nav="pill"] .nav a {
    border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 20px; background: var(--card);
    letter-spacing: .1em; text-indent: .1em;
  }
  body.mv[data-nav="pill"] .nav a { padding: 6px 14px; }
  body[data-nav="pill"] .nav a.on { background: var(--gold); border-color: var(--gold); color: #000; font-weight: 600; }
  body.edit .nav a { outline: 1px dashed color-mix(in srgb, var(--gold), transparent 65%); outline-offset: 3px; border-radius: 3px; }

  .wrap { max-width: 860px; margin: 0 auto; padding: 26px 22px 60px; }
  body.mv .wrap { padding: 20px 16px 46px; }
  .page { display: none; }
  .page.on { display: block; animation: fadein .4s ease; }
  body[data-fx="slide"] .page.on { animation: slidein .4s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slidein { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }

  /* ══ 블록 ══ */
  .blk { margin-bottom: 32px; position: relative; }
  .blk-label {
    font-size: 10px; letter-spacing: .32em;
    color: var(--gold-dim); margin-bottom: 13px;
    display: flex; align-items: center; gap: 12px;
  }
  .blk-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  .prof-card {
    display: flex; gap: 15px; align-items: center;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; max-width: 380px;
  }
  .prof-img {
    width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #2A2A3E, #12121C);
    background-size: cover; background-position: center;
    border: 1px solid var(--gold-dim);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold); font-size: 20px;
  }
  .prof-name { font-size: 16px; font-weight: 600; letter-spacing: .06em; }
  .prof-name span { color: var(--gold); font-size: 11px; margin-left: 6px; letter-spacing: .12em; }
  .prof-desc { font-size: 12px; color: var(--tx-dim); margin-top: 5px; line-height: 1.6; white-space: pre-line; }
  .blk[data-style="text"] .prof-card { background: none; border: none; padding: 0; max-width: none; }
  .blk[data-style="text"] .prof-img { display: none; }
  .blk[data-style="banner"] .prof-card {
    max-width: none; flex-direction: column; text-align: center;
    padding: 28px 18px; gap: 12px; border-color: var(--gold-dim);
  }

  .txt { font-size: 13.5px; line-height: 2.0; white-space: pre-line; }
  .txt em { color: var(--gold); font-style: normal; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    font-size: 11px; letter-spacing: .08em; padding: 6px 13px;
    border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--tx-dim);
  }
  .badge.g { border-color: var(--gold-dim); color: var(--gold); }
  .blk[data-style="square"] .badge { border-radius: 6px; background: var(--card2); letter-spacing: .12em; }
  .blk[data-style="stamp"] .badge {
    border-radius: 4px; border: 1px dashed var(--gold-dim);
    background: none; color: var(--gold-dim);
    text-transform: uppercase; letter-spacing: .16em;
    font-size: 10px; padding: 7px 14px;
  }
  .blk[data-style="stamp"] .badge.g { border-style: solid; color: var(--gold); }

  .sns { display: flex; gap: 10px; flex-wrap: wrap; }
  .sns a {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card);
    display: flex; align-items: center; justify-content: center;
    color: var(--tx-dim); font-size: 14px;
    text-decoration: none; transition: all .2s;
  }
  .sns a:hover { border-color: var(--gold); color: var(--gold); }

  .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--line) 30%, var(--line) 70%, transparent); margin: 4px 0; }
  .divider.deco { display: flex; align-items: center; justify-content: center; height: auto; background: none; gap: 12px; color: var(--gold-dim); font-size: 10px; }
  .divider.deco::before, .divider.deco::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--line)); }
  .divider.deco::after { background: linear-gradient(90deg, var(--line), transparent); }

  .fold { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
  .fold-head {
    padding: 14px 18px; font-size: 12.5px; color: var(--tx-dim);
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    user-select: none;
  }
  .fold-head::after { content: '▾'; color: var(--gold-dim); transition: transform .25s; }
  .fold.open .fold-head::after { transform: rotate(180deg); }
  .fold-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
  .fold.open .fold-body { max-height: 900px; }
  .fold-body-in { padding: 13px 18px 17px; font-size: 12.5px; line-height: 1.9; color: var(--tx-dim); border-top: 1px solid var(--line); white-space: pre-line; }

  .g-grid { display: grid; grid-template-columns: repeat(var(--gcols, 6), 1fr); gap: 7px; }
  @media (max-width: 700px) { .g-grid { grid-template-columns: 1fr; } }
  body.mv .g-grid { grid-template-columns: 1fr; }
  .g-cell {
    aspect-ratio: 1; border-radius: 8px;
    background: linear-gradient(145deg, var(--card2), var(--card));
    background-size: cover; background-position: center;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--tx-mute); font-size: 10px; cursor: pointer;
  }
  body.mv .g-cell { aspect-ratio: 16/9; }
  @media (max-width: 700px) { .g-cell { aspect-ratio: 16/9; } }

  .g-slider { position: relative; }
  .g-track { display: flex; overflow: hidden; border-radius: 12px; }
  .g-slide {
    min-width: 100%; aspect-ratio: 21/9;
    background: linear-gradient(150deg, var(--card2), var(--card));
    background-size: cover; background-position: center;
    border: 1px solid var(--line); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--tx-mute); font-size: 11px; letter-spacing: .12em;
    transition: transform .4s ease;
  }
  @media (max-width: 700px) { .g-slide { aspect-ratio: 16/10; } }
  body.mv .g-slide { aspect-ratio: 16/10; }
  .g-nav { display: flex; justify-content: center; gap: 6px; margin-top: 11px; }
  .g-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--tx-mute); cursor: pointer; transition: all .2s; }
  .g-dot.on { background: var(--gold); width: 16px; border-radius: 3px; }
  .g-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 50%;
    background: #000a; border: 1px solid var(--line);
    color: var(--gold); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .g-prev { left: 10px; } .g-next { right: 10px; }

  .music {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; max-width: 420px;
  }
  .m-disc {
    width: 46px; height: 46px; border-radius: 50%;
    background: repeating-radial-gradient(circle, var(--card2) 0 2px, var(--card) 2px 4px);
    border: 1px solid var(--gold-dim);
    position: relative; flex-shrink: 0;
    animation: spin 7s linear infinite; animation-play-state: paused;
  }
  .music.playing .m-disc { animation-play-state: running; }
  .m-disc::after { content: ''; position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); transform: translate(-50%, -50%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .m-info { flex: 1; min-width: 0; }
  .m-title { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m-artist { font-size: 11px; color: var(--tx-dim); margin-top: 3px; }
  .m-bar { margin-top: 8px; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .m-bar i { display: block; height: 100%; width: 0%; background: var(--gold); transition: width .3s linear; }
  .m-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--gold-dim); background: transparent;
    color: var(--gold); font-size: 12px; cursor: pointer; flex-shrink: 0;
  }

  .links { display: flex; flex-direction: column; gap: 9px; max-width: 480px; }
  .link {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 17px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card);
    font-size: 12.5px; color: var(--tx); text-decoration: none;
    transition: border-color .2s;
  }
  .link:hover { border-color: var(--gold-dim); }
  .link span { color: var(--gold-dim); font-size: 11px; }

  .dream-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .dream-grid { grid-template-columns: 1fr; } }
  body.mv .dream-grid { grid-template-columns: 1fr; }
  .dream { border: 1px solid var(--line); border-radius: 14px; background: var(--card); padding: 19px 18px 17px; position: relative; }
  .dream.main { grid-column: 1 / -1; border-color: var(--gold-dim); }
  .d-rank {
    position: absolute; top: -1px; right: 18px;
    font-size: 9px; letter-spacing: .28em; padding: 5px 11px 4px;
    background: var(--gold); color: var(--bg);
    border-radius: 0 0 6px 6px; font-weight: 700;
  }
  .d-rank.sub { background: var(--card2); color: var(--gold-dim); border: 1px solid var(--line); border-top: none; }
  .d-pair { font-size: 16px; font-weight: 600; }
  .d-pair b { color: var(--gold); font-weight: 600; }
  .d-name { font-size: 10.5px; letter-spacing: .2em; color: var(--gold-dim); margin-top: 6px; }
  .d-desc { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 12.5px; line-height: 1.85; color: var(--tx-dim); white-space: pre-line; }

  .chat {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 16px;
    display: flex; flex-direction: column; gap: 12px; max-width: 560px;
  }
  .c-row { display: flex; gap: 9px; align-items: flex-end; }
  .c-row.me { flex-direction: row-reverse; }
  .c-av {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--card2); border: 1px solid var(--line);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--gold-dim);
  }
  .c-bub {
    max-width: 72%; padding: 10px 14px;
    border-radius: 14px 14px 14px 4px;
    background: var(--card2); border: 1px solid var(--line);
    font-size: 12.5px; line-height: 1.6;
  }
  .c-row.me .c-bub {
    border-radius: 14px 14px 4px 14px;
    background: color-mix(in srgb, var(--gold), var(--bg) 85%);
    border-color: var(--gold-dim);
  }

  .banners { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
  .banners a { display: block; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; transition: border-color .2s; position: relative; }
  .banners a:hover { border-color: var(--gold-dim); }
  .banners img { display: block; max-width: 220px; max-height: 60px; }
  body.mv .banners img { max-width: 46vw; }
  .banners .tb {
    display: flex; align-items: center; justify-content: center;
    width: 200px; height: 52px;
    background: linear-gradient(145deg, var(--card2), var(--card));
    color: var(--tx-dim); font-size: 12px; letter-spacing: .1em;
    padding: 0 12px; text-align: center;
  }
  .banners .mut {
    position: absolute; top: 2px; right: 5px;
    font-size: 10px; color: var(--gold);
    text-shadow: 0 0 4px #000;
  }

  .dday-card {
    display: inline-flex; align-items: baseline; gap: 14px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 22px;
  }
  .dday-num { font-size: 28px; font-weight: 700; color: var(--gold); letter-spacing: .04em; }
  .dday-t { font-size: 12.5px; color: var(--tx-dim); }

  .quote-box { border-left: 2px solid var(--gold); padding: 4px 0 4px 16px; max-width: 560px; }
  .quote-tx { font-size: 14px; line-height: 2; white-space: pre-line; }
  .quote-src { margin-top: 8px; font-size: 10.5px; letter-spacing: .18em; color: var(--gold-dim); }

  .stickers { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .stickers img { display: block; }

  .htmlblk { max-width: 100%; overflow-x: auto; }
  .htmlblk img, .htmlblk video, .htmlblk iframe { max-width: 100%; height: auto; }
  .htmlblk table { max-width: 100%; }

  .foot-zone {
    max-width: 860px; margin: 0 auto;
    padding: 10px 22px 44px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .heart-btn {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 26px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--tx-dim); font-size: 13px; cursor: pointer;
    transition: all .2s;
  }
  .heart-btn:hover { border-color: var(--gold-dim); }
  .heart-btn.liked { border-color: var(--gold); color: var(--gold); }
  .heart-btn .h { font-size: 15px; transition: transform .2s; }
  .heart-btn.liked .h { transform: scale(1.25); }
  .foot-meta { display: flex; align-items: center; gap: 16px; font-size: 10px; letter-spacing: .18em; color: var(--tx-mute); }
  .copy-btn {
    background: none; border: none; color: var(--gold-dim);
    font-size: 10px; letter-spacing: .18em; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .copy-btn:hover { color: var(--gold); }
  .foot { text-align: center; font-size: 9px; letter-spacing: .3em; color: var(--tx-mute); }
  .foot a { color: var(--tx-mute); text-decoration: none; }

  /* ══ 편집 모드 ══ */
  .fab-row { position: fixed; top: 16px; right: 16px; z-index: 300; display: flex; gap: 8px; }
  .fab {
    padding: 9px 18px; border-radius: 999px;
    border: 1px solid var(--gold-dim);
    background: #000c; color: var(--gold);
    font-size: 12px; letter-spacing: .1em;
    cursor: pointer; backdrop-filter: blur(6px);
    transition: all .2s;
  }
  body.edit #fab-edit { background: var(--gold); color: #000; font-weight: 700; }
  .view-seg {
    position: fixed; top: 16px; left: 16px; z-index: 300;
    display: none;
    border: 1px solid var(--gold-dim);
    border-radius: 999px; overflow: hidden;
    backdrop-filter: blur(6px);
  }
  body.edit .view-seg { display: flex; }
  .view-seg button {
    padding: 9px 16px; background: #000c; border: none;
    color: var(--tx-dim); font-size: 12px; cursor: pointer;
  }
  .view-seg button.on { background: var(--gold); color: #000; font-weight: 700; }

  body.edit .blk {
    outline: 1px dashed color-mix(in srgb, var(--gold), transparent 50%);
    outline-offset: 8px; border-radius: 4px;
  }
  .blk-tools {
    display: none;
    position: absolute; top: -14px; right: -6px;
    z-index: 5; gap: 4px;
  }
  body.edit .blk-tools { display: flex; }
  .bt {
    width: 26px; height: 26px; border-radius: 7px;
    border: 1px solid var(--gold-dim);
    background: #000d; color: var(--gold);
    font-size: 11px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .bt:hover { background: var(--gold); color: #000; }
  .bt.del:hover { background: #C0392B; border-color: #C0392B; color: #fff; }

  .addline {
    display: none; margin: -14px 0 18px;
    text-align: center; position: relative;
    cursor: pointer; user-select: none;
  }
  body.edit .addline { display: block; }
  .addline::before {
    content: ''; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: color-mix(in srgb, var(--gold), transparent 70%);
  }
  .addline span {
    position: relative; background: var(--bg);
    padding: 0 14px; font-size: 11px; letter-spacing: .1em;
    color: var(--gold);
  }
  .addline:hover span { text-decoration: underline; }

  /* 팝업 공통 */
  .pop {
    display: none; position: fixed; inset: 0;
    background: #000a; z-index: 400;
    align-items: center; justify-content: center;
    backdrop-filter: blur(3px);
    padding: 16px;
  }
  .pop.on { display: flex; }
  .pop-in {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px;
    width: 400px; max-width: 94vw;
    max-height: 86dvh; overflow-y: auto;
  }
  .pop-in h3 { font-size: 12px; letter-spacing: .2em; color: var(--gold-dim); margin-bottom: 15px; }
  .am-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .am-item {
    padding: 13px 6px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card2);
    text-align: center; font-size: 11.5px; cursor: pointer;
    transition: border-color .15s;
  }
  .am-item:hover { border-color: var(--gold); color: var(--gold); }

  .f-row { margin-bottom: 14px; }
  .f-row label { display: block; font-size: 11px; letter-spacing: .08em; color: var(--tx-dim); margin-bottom: 7px; }
  .f-row input[type="text"], .f-row input[type="password"], .f-row textarea, .f-row select {
    width: 100%; background: var(--card2);
    border: 1px solid var(--line); border-radius: 8px;
    color: var(--tx); font-size: 12.5px; padding: 9px 11px;
    font-family: var(--font);
  }
  .f-row textarea { min-height: 84px; resize: vertical; line-height: 1.7; }
  .f-row input:focus, .f-row textarea:focus, .f-row select:focus { outline: none; border-color: var(--gold-dim); }
  .f-note { font-size: 10.5px; color: var(--tx-mute); line-height: 1.7; margin-top: 4px; }
  .f-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .f-actions .btn { padding: 9px 20px; font-size: 12px; }
  .f-imgs { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .f-img {
    width: 62px; height: 62px; border-radius: 8px;
    background-size: cover; background-position: center;
    border: 1px solid var(--line); position: relative; cursor: pointer;
  }
  .f-img i {
    position: absolute; top: -6px; right: -6px;
    width: 18px; height: 18px; border-radius: 50%;
    background: #C0392B; color: #fff; font-size: 10px; font-style: normal;
    display: flex; align-items: center; justify-content: center;
  }

  /* 설정 패널 */
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 340px; max-width: 90vw;
    background: color-mix(in srgb, var(--card), black 20%);
    border-left: 1px solid var(--line);
    z-index: 350;
    transform: translateX(100%);
    transition: transform .3s ease;
    padding: 24px 22px; overflow-y: auto;
  }
  body.edit .panel.open { transform: none; }
  .panel h2 { font-size: 12px; letter-spacing: .26em; color: var(--gold); margin-bottom: 22px; }
  .p-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .p-row { margin-bottom: 16px; }
  .p-row label { display: block; font-size: 11px; letter-spacing: .08em; color: var(--tx-dim); margin-bottom: 7px; }
  .p-row input[type="color"] {
    width: 100%; height: 36px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--card2); cursor: pointer; padding: 3px;
  }
  .p-row select, .p-row textarea, .p-row input[type="text"], .p-row input[type="password"] {
    width: 100%; background: var(--card2);
    border: 1px solid var(--line); border-radius: 8px;
    color: var(--tx); font-size: 12px; padding: 9px 10px;
    font-family: var(--font);
  }
  .p-row textarea { min-height: 90px; resize: vertical; font-family: monospace; font-size: 11px; line-height: 1.6; }
  .p-note { font-size: 10.5px; color: var(--tx-mute); line-height: 1.7; margin-top: 4px; }
  .p-divider { height: 1px; background: var(--line); margin: 18px 0; }
  .p-btn {
    width: 100%; padding: 10px 0; border-radius: 8px;
    border: 1px solid var(--line); background: var(--card2);
    color: var(--tx-dim); font-size: 12px; cursor: pointer;
    margin-bottom: 8px;
  }
  .p-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .tab-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .tab-item {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--card2); font-size: 12px;
  }
  .tab-item span { flex: 1; }
  .tab-item button { background: none; border: none; color: var(--gold-dim); cursor: pointer; font-size: 12px; padding: 2px 4px; }
  .tab-item button:hover { color: var(--gold); }

  .panel-toggle {
    position: fixed; bottom: 20px; right: 20px; z-index: 349;
    display: none;
    padding: 11px 20px; border-radius: 999px;
    border: 1px solid var(--gold-dim);
    background: #000d; color: var(--gold);
    font-size: 12px; letter-spacing: .08em;
    cursor: pointer; backdrop-filter: blur(6px);
  }
  body.edit .panel-toggle { display: block; }
  .save-fab {
    position: fixed; bottom: 20px; left: 20px; z-index: 349;
    display: none;
    padding: 11px 24px; border-radius: 999px;
    border: 1px solid var(--gold);
    background: var(--gold); color: #000;
    font-size: 12px; font-weight: 700; letter-spacing: .08em;
    cursor: pointer;
  }
  body.edit .save-fab { display: block; }

  @media (max-width: 700px) {
    .panel {
      top: auto; left: 0; right: 0; bottom: 0;
      width: 100%; max-width: none; height: 64vh;
      border-left: none; border-top: 1px solid var(--line);
      border-radius: 18px 18px 0 0;
      transform: translateY(100%);
    }
  }

  /* 라이트박스 */
  #lightbox {
    display: none; position: fixed; inset: 0;
    background: #000d; z-index: 500;
    align-items: center; justify-content: center;
  }
  #lightbox.on { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 88dvh; border-radius: 10px; }

  /* 토스트 */
  #toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #000d; border: 1px solid var(--gold-dim);
    color: var(--gold); font-size: 12px; letter-spacing: .06em;
    padding: 11px 22px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: all .3s; z-index: 600;
    backdrop-filter: blur(6px);
    max-width: 88vw; text-align: center;
  }
  #toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: .3em; color: var(--tx-mute); }
</style>
</head>
